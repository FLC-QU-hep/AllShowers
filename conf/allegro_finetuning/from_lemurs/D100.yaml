run_name: ALLEGRO
result_path: results/finetune_ALLEGRO

finetune:
  # set to your own pre-training run or to the released weights (Hugging Face)
  pretrained: results/pretrain_lemurs/20260412_232911_LEMURS-Pretrain/from_scratch/weights/best.pt

data:
  path: data/finetune_allegro/allegro_100k.h5
  stop: 10_100

  samples_energy_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 2]}]
  cond_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  sampling_frac_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  nlayers_trafo:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]
  return_noise: True
  noise_path: data/finetune_allegro/allegro_ot_noise.h5
  return_direction: True
  return_sampling_frac: True
  return_nlayers: True

  val_len: 10_000

# Architecture must match LEMURS pretrain (num_layers=90)
model:
  num_layers: 90
  dim_inputs: [3, 6, 6]
  dim_embedding: 64
  num_head: 4
  num_blocks: 4
  dim_feedforward: 256
  num_points_cond: 512
  activation: GELU
  num_layer_cond: 4
  num_particles: 1
  flow_config:
    frequencies: 3

train:
  num_epochs: 500
  batch_size: 256
  learning_rate: 1.e-4
  optimizer: Ranger
  scheduler: Cosine
  weight_decay: 1.e-2
  grad_clip: 0.2
  matmul_precision: highest
