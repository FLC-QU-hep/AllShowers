run_name: SimpleBox-Pretrain
result_path: results/SimpleBox-Pretrain

data:
  path: data/pretrain_simplebox/4Mshowers_angles.h5
  stop: 4_000_000

  samples_energy_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 2]}]
  cond_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  sampling_frac_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  nlayers_trafo:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]
  return_noise: True
  return_direction: True
  return_sampling_frac: True
  return_nlayers: True

  val_len: 50_000

model:
  num_layers: 45
  dim_inputs: [3, 6, 6] # (x,y,e), 2xfourier, (energy, 3momentum, SF, nlayers)
  dim_embedding: 64
  num_head: 4
  num_blocks: 4
  dim_feedforward: 256
  num_points_cond: 512
  activation: GELU
  num_layer_cond: 4
  num_particles: 1
  flow_config:
    frequencies: 3

train:
  num_epochs: 400
  batch_size: 256
  learning_rate: 1.e-3
  optimizer: Ranger
  scheduler: Cosine
  weight_decay: 1.e-2
  grad_clip: 0.2
  matmul_precision: highest
