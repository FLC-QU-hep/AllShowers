[project]
name = "allshowers"
version = "1.0.0"
description = "A point cloud CNF-Transformer to generate any Shower"
readme = "README.md"
authors = [
    {name = "Thorsten Buss", email = "Thorsten.Buss@uni-hamburg.de"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = "==3.13.*"
dependencies = [
    "h5py~=3.16.0",
    "matplotlib~=3.11.0",
    "numpy~=2.5.1",
    "pot~=0.9.7",
    "pyyaml~=6.0.3",
    "rangerlite~=1.0.2",
    "rich~=15.0.0",
    "showerdata~=0.6.1",
    "torch~=2.13.0",
    "pointcountfm @ git+https://github.com/FLC-QU-hep/PointCountFM.git@unified_sampling",
]

[dependency-groups]
dev = [
    "ipykernel~=7.3.0",
    "pre-commit~=4.6.0",
    "ruff~=0.15.21",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["allshowers"]

[tool.ruff]
target-version = "py313"
fix = true

[tool.ruff.lint]
extend-select = ["C4", "I", "SIM", "UP"]
